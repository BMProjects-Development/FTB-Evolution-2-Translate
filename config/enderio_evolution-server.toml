#Undying Totem Capacitor Settings
[UndyingTotemCapacitor]
	#Enable custom calculation logic for the Undying Totem Capacitor.
	#If false, it uses the hardcoded vanilla tier logic.
	enableCustomMath = false

	#Efficiency Enchantment Settings
	[UndyingTotemCapacitor.EfficiencySettings]
		#The base capacitor level when there is no Efficiency enchantment.
		# Default: 3.5
		# Range: 0.0 ~ 100.0
		baseLevel = 3.5
		#How much capacitor level is added per Efficiency enchantment level.
		#Calculation: Final Level = Base Level + (Effective Enchant Level * Increment)
		# Default: 0.5
		# Range: 0.0 ~ 100.0
		levelIncrementPerEnchant = 0.5
		#Limits the maximum Efficiency *enchantment level* used in the calculation, NOT the final capacitor level.
		#For example, if set to 5, an Efficiency X (10) enchant will only be calculated as level 5.
		#Set to -1 for unlimited scaling.
		# Default: 5
		# Range: -1 ~ 255
		maxEnchantLimit = 5

	#Unbreaking Enchantment Settings
	[UndyingTotemCapacitor.UnbreakingSettings]
		#How much expected lifespan (in percent) is added per Unbreaking level.
		#Default is 13.3 (which means 13.3%).
		# Default: 13.3
		# Range: 0.0 ~ 1000.0
		unbreakingIncrementPercent = 13.3
		#Limits the maximum Unbreaking *enchantment level* used for durability scaling.
		#Set to -1 for unlimited durability scaling.
		# Default: 3
		# Range: -1 ~ 255
		maxUnbreakingLimit = 3
