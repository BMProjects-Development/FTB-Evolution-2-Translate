[recipes]
	#Macerator recipes that turn metal ores, raw metals and raw metal blocks into dust.
	add_dust_from_ore_recipes = true
	#Macerator recipes that turn ingots, gems, storage blocks, coal, charcoal and obsidian into dust.
	add_dust_from_material_recipes = true
	#Macerator recipes for coal, diamond, emerald, lapis, quartz and redstone ores.
	add_gem_from_ore_recipes = true
	#Extruder recipes that turn ingots and obsidian dust into rods.
	add_rod_recipes = true
	#Roller recipes that turn ingots into plates, and the obsidian plate compressor recipe.
	add_plate_recipes = true
	#Extruder recipes that turn plates into gears.
	add_gear_recipes = true
	#Canning Machine recipes that pack food into cans.
	add_canned_food_recipes = true
