#Show the Hats welcome chat message when joining a world
showWelcomeMessage = true
#Chance for mobs to spawn wearing hats
#0.0 = never
#1.0 = always
# Default: 0.6
# Range: 0.0 ~ 1.0
mobHatSpawnChance = 0.6
#Hat gameplay mode
#COSMETIC = all hats unlocked
#HUNTING = hats must be unlocked by killing mobs
#Allowed Values: COSMETIC, HUNTING
hatMode = "HUNTING"
#Hat menu style
#LEGACY = Hats 1.7.10 window
#MODERN = Hats 1.16.5 / Renewed grid
#Allowed Values: LEGACY, MODERN
guiStyle = "LEGACY"
#Color Legacy GUI hat names by rarity outside the rarity categories
showRarityColorsEverywhere = false
#Hat stand menu style
#Allowed Values: LEGACY, MODERN
hatStandGuiStyle = "LEGACY"
#When a hatless mob kills a hatted mob, the killer inherits the hat
mobHatTakeover = true
#When true, boss mobs (ender dragon, wither, elder guardian, warden)
#can spawn with hats. When false they never spawn hatted;
#per-mob toggles still apply when this is on.
bossMobHats = true
#When true, undead mobs wearing a hat do not burn in sunlight.
#Default: false.
preventUndeadFire = false
#When true, (C) contributor hats are excluded from random
#mob hat spawn rolls. Already worn hats are left alone. Default: false.
disableContributorHats = false
#Ticks a launched hat entity lives before disappearing
# Default: 6000
# Range: 20 ~ 72000
hatEntityLifespan = 6000
#Launched hats can knock a hat off another player
hatLauncherReplacesPlayerHat = true
#When a launched hat hits a player, keep their previous hat in inventory
hatLauncherDoesNotRemoveHatFromInventory = true
#If true, a chat message is broadcast to all players whenever one
#of them unlocks a new hat for the first time. The hat name is
#colored by rarity and hovering shows its info. Default: false.
hatUnlockChatAnnouncement = false

