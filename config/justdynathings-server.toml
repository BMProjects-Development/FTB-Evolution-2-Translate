#Misc
[entry_misc]
	#Hello player, DevDyna is here !
	#If you're wondering that this ConfigKeys part
	#is used as joke , you are right...
	#Anyway , can I be of help to you ?
	answer = false
	#Include any fuel item to Generator JEI category
	include_any_jei_fuels = true
	#Disable Fuel JEI categories when Just Tiered Generators is installed
	disable_jei_fuels = true
	#Define the pool of strings that will show as tooltip below Void Crystal
	void_crystal_tooltips = ["Unstable Stability", "This is time", "Fragment of reality", "The paradox must grow", "Is the time a lie?", "There is a paradox on your timeline", "Time to collapse", "Time is relative", "Its time to collapse", "You collapse me round", "Press T to collapse", "Paradox mentioned", "Never gone collapse up", "Better with Time"]

