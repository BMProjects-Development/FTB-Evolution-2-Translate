#Wands
[entry_wands]
	#Picker Wand support Fake Players
	picker_wand_allow_fakeplayer = false
	#Swapper Wand support Fake Players
	swapper_wand_allow_fakeplayer = false
	#Advanced Time Wand support Fake Players
	advanced_time_wand_allow_fakeplayer = true
	#MB Capacity
	# Default: 800000
	# Range: > 1
	advanced_time_wand_max_fluid_storage = 800000
	#FE Capacity
	# Default: 10000000
	# Range: > 1
	advanced_time_wand_max_energy_storage = 10000000
	#Mode NORMAL [1|2|4|8]
	advanced_time_wand_mode_normal = 1
	#Mode X2 [1|2|4|8]
	advanced_time_wand_mode_x2 = 2
	#Mode X4 [1|2|4|8]
	advanced_time_wand_mode_x4 = 4
	#Mode MAX [1|2|4|8]
	advanced_time_wand_mode_max = 8
	#Max speed applicable with Advanced Time Wand
	# It can disable other wand-modes when below 256
	# This value should be a power of two
	advanced_time_wand_max_multiplier = 256
	#Light Wands can be used to apply Glowing effect
	light_wand_glowing = true
	#Light Wands can place Light Blocks
	light_wand_placing = true
	#Enable/Disable sound event
	light_wand_sound = true
	#Light wands can modify light level
	light_wand_light_level_change = true
	#Light Wands support Fake Players
	light_wand_allow_fakeplayer = true
	#FE Capacity
	# Default: 10000
	# Range: > 1
	light_wand_max_energy_storage = 10000
	#FE/t
	# Default: 100
	# Range: > 1
	light_wand_energy_every_tick = 100
	#Glowing duration 
	# 20 -> 1 second
	# Default: 200
	# Range: > 1
	light_wand_glowing_duration = 200
	#Glowing duration 
	# 20 -> 1 second
	# Default: 800
	# Range: > 1
	advanced_light_wand_glowing_duration = 800
	#Light Wand Blocks emit particles
	light_wand_block_particles = true
