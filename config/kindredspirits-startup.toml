#Level 1 base stats for each companion species.
#Attributes are built while the game loads, so changes need a restart.
#These are not synced: a server and its clients should use the same values.
[species]

	[species.nightfox]
		#Base max health at level 1.
		# Default: 35.0
		# Range: 1.0 ~ 1024.0
		max_health = 35.0
		#Base movement speed. A vanilla wolf is 0.3.
		# Default: 0.32
		# Range: 0.0 ~ 2.0
		movement_speed = 0.32
		#Base attack damage at level 1.
		# Default: 3.0
		# Range: 0.0 ~ 1024.0
		attack_damage = 3.0
		#Base armour.
		# Default: 2.0
		# Range: 0.0 ~ 30.0
		armour = 2.0
		#Base knockback resistance, 0 to 1.
		# Default: 0.0
		# Range: 0.0 ~ 1.0
		knockback_resistance = 0.0
		#How far it will notice something to fight, and how far its goals reach.
		# Default: 24.0
		# Range: 1.0 ~ 128.0
		follow_range = 24.0
		#Multiplier on the per-level health and attack gains from the common config.
		# Default: 1.0
		# Range: 0.0 ~ 10.0
		growth_multiplier = 1.0

