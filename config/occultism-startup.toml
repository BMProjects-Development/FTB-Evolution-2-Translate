#Dimensional Mineshaft Settings
[dimensional_mineshaft]

	#Miner Spirit Settings
	[dimensional_mineshaft.miner_foliot_unspecialized]
		#The amount of time it takes the spirit to perform one mining operation.
		# Default: 400
		# Range: > 0
		maxMiningTime = 400
		#The amount of random blocks the spirit will obtain per mining operation
		# Default: 1
		# Range: > 0
		rollsPerOperation = 1
		#The amount of same block the spirit will obtain per mining operation
		# Default: 1
		# Range: > 0
		outputMultiplier = 1
		#The amount of mining operations the spirit can perform before breaking.
		# Default: 511
		# Range: > 0
		durability = 511

