[DISPLAYS]
	#The x position of the display for coins
	#Tips: 80 for align for right side
	# Default: 0
	# Range: > -2147483648
	xDisplayCurrency = 80
	#The y position of the display for coins
	# Default: 0
	# Range: > -2147483648
	yDisplayCurrency = 0
	#Whether to display the coin amount in the inventory screen
	activeDisplayCurrency = true
	#The x position of the display for coins in creative mode
	# Default: 0
	# Range: > -2147483648
	xDisplayCurrencyCreative = 0
	#The y position of the display for coins in creative mode
	# Default: 0
	# Range: > -2147483648
	yDisplayCurrencyCreative = 0
